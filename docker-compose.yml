version: '3.8'

services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.creativefringeweb.rule=Host(`creativefringe.digital`)
      - traefik.http.routers.creativefringeweb.entrypoints=websecure
      - traefik.http.routers.creativefringeweb.tls.certresolver=letsencrypt
      - traefik.http.services.creativefringeweb.loadbalancer.server.port=80
    networks:
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
